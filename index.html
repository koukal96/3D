<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D MODELY — Strážce úrody</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script>
        self.ModelViewerElement = self.ModelViewerElement || {};
        self.ModelViewerElement.meshoptDecoderLocation = 'https://unpkg.com/meshoptimizer/meshopt_decoder.js';
    </script>

    <style>
        :root {
            --bg-light: #ffffff; 
            --panel-bg: rgba(255, 255, 255, 0.85);
            --brand-primary: #8CC63F; 
            --text-main: #121212;
            --text-muted: #666666;
            --border-color: rgba(0, 0, 0, 0.08);
            --font-display: 'Cinzel', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-light); color: var(--text-main); font-family: var(--font-sans); }
        .app-container { min-height: 100dvh; display: flex; flex-direction: column; padding: 24px; gap: 40px; }

        header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .brand-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
        .brand-title span { color: var(--brand-primary); }
        
        .gallery { display: flex; flex-direction: column; gap: 60px; }
        .showroom-section { display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        .viewer-container { position: relative; width: 100%; max-width: 900px; height: 50vh; min-height: 400px; border: 1px solid var(--border-color); border-radius: 24px; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; }

        .custom-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: 80%; }
        .spinner { width: 36px; height: 36px; border: 2px solid var(--border-color); border-top: 2px solid var(--brand-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-track { width: 100%; height: 2px; background: var(--border-color); margin-top: 10px; }
        .progress-fill { width: 0%; height: 100%; background: var(--brand-primary); transition: width 0.2s; }
        
        .ar-trigger-btn { position: absolute; bottom: 20px; right: 20px; background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 12px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; font-weight: 600; }
        
        footer { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; text-align: center; }
        .cuckoo-signature { font-family: var(--font-display); color: #b59453; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand-title">3D <span>Modely</span></div>
        </header>

        <div class="gallery">
            <section class="showroom-section">
                <div class="viewer-container">
                    <div class="custom-loader"><div class="spinner"></div><div class="progress-track"><div class="progress-fill"></div></div></div>
                    <model-viewer src="/3D/mohelnice.glb" camera-controls auto-rotate loading="eager" ar>
                        <button class="ar-trigger-btn" slot="ar-button">Zobrazit v AR</button>
                    </model-viewer>
                </div>
            </section>

            <section class="showroom-section">
                <div class="viewer-container">
                    <div class="custom-loader"><div class="spinner"></div><div class="progress-track"><div class="progress-fill"></div></div></div>
                    <model-viewer src="/3D/verovany.glb" camera-controls auto-rotate loading="eager" ar>
                        <button class="ar-trigger-btn" slot="ar-button">Zobrazit v AR</button>
                    </model-viewer>
                </div>
            </section>
        </div>

        <footer>
            <div style="margin-bottom:10px">Bc. Jan Koukal</div>
            <div>Vytvořeno by <a href="https://koukal96.github.io/Cuckoo/" class="cuckoo-signature">Cuckoo</a></div>
        </footer>
    </div>

    <script>
        document.querySelectorAll('model-viewer').forEach(viewer => {
            const fillBar = viewer.previousElementSibling.querySelector('.progress-fill');
            viewer.addEventListener('progress', (e) => {
                const p = Math.round(e.detail.totalProgress * 100);
                if(fillBar) fillBar.style.width = `${p}%`;
            });
            viewer.addEventListener('load', () => { 
                viewer.previousElementSibling.style.display = 'none'; 
            });
            viewer.addEventListener('error', () => {
                fillBar.style.backgroundColor = '#8CC63F'; // I při chybě zůstane zelená
            });
        });
    </script>
</body>
</html>
