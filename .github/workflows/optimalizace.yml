name: Optimalizace Usov pro AR

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Stazeni kodu
        uses: actions/checkout@v3

      - name: Instalace Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalace 3D nastroju
        run: npm install -g @gltf-transform/cli meshoptimizer

      - name: Optimalizace Usov (Jaderny rez)
        run: |
          if [ -f "usov.glb" ]; then
            export NODE_OPTIONS="--max-old-space-size=7168"
            gltf-transform simplify usov.glb temp1.glb --ratio 0.0005 --error 0.1
            gltf-transform prune temp1.glb temp2.glb
            gltf-transform resize temp2.glb usov-ar.glb --width 1024 --height 1024
            rm temp1.glb temp2.glb
          else
            echo "Soubor usov.glb nebyl nalezen!"
          fi

      - name: Nahrani na GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add usov-ar.glb
          git commit -m "Ultra-odlehceny Usov pro AR (pod 25MB)" || echo "Zadne zmeny"
          git push
